<!DOCTYPE html>
<head>
    <meta http-equiv=Content-Type content=text/html; charset=UTF-8>
    <link rel="stylesheet" href="/default.css">
    <title>HeatingController32 Backup</title>
    <script type="text/javascript" src="/filesaver.min.js"></script>
    <script type="text/javascript" src="/jquery-3.6.1.min.js"></script>
    <script type="text/javascript" src="/jszip.min.js"></script>
    <script type="text/javascript" src="jszip-utils.min.js"></script>
</head>
<body>
    <div class="content">
        <div style="color:#eaeaea;">
            <h3>Backup Configuration</h3>
            <p>Download all configuration files as a ZIP archive.</p>
        </div>
        <div style="color:#eaeaea;text-align: left;">
            <button id="backup_button" class="bgrn">Download Backup</button>
            <p id="status_message" style="margin-top: 10px;"></p>
        </div>
        <div class="spacer"></div>
        <p class="item-main"><a href="/">Main</a></p>
    </div>
    <p class="build-no">Build: %BUILD_NO%</p>
    <script>
        jQuery(function ($) {
            function urlToPromise(url) {
                return new Promise(function(resolve, reject) {
                    JSZipUtils.getBinaryContent(url, function (err, data) {
                        if(err) {
                            reject(err);
                        } else {
                            resolve(data);
                        }
                    });
                });
            }

            $("#backup_button").on("click", function () {
                var zip = new JSZip();
                var heaters_folder = zip.folder("heaters");
                
                $("#status_message").text("Creating backup...");
                
                // Add settings.cfg
                zip.file("settings.cfg", urlToPromise("/settings.cfg"), {binary:true});
                
                // Add all heater property files for heaters 0-7
                var properties = ["name", "subtopic", "isEnabled", "sensorAddress", 
                                 "port", "phase", "isAuto", "powerConsumption", 
                                 "priority", "targetTemperature", "temperatureAdjust", 
                                 "useExternalSensor", "externalSensorTopic"];
                
                for (var i = 0; i < 8; i++) {
                    for (var j = 0; j < properties.length; j++) {
                        var filename = i + "_" + properties[j] + ".cfg";
                        var url = "/heaters/" + filename;
                        heaters_folder.file(filename, urlToPromise(url), {binary:true});
                    }
                }
                
                // Generate and download ZIP
                zip.generateAsync({type:"blob"})
                    .then(function callback(blob) {
                        var timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                        saveAs(blob, "heatingcontroller_backup_" + timestamp + ".zip");
                        $("#status_message").text("Backup downloaded successfully!");
                    })
                    .catch(function(err) {
                        $("#status_message").text("Error creating backup: " + err);
                    });
                
                return false;
            });
        });
    </script>
</body>
