<!DOCTYPE HTML>
<html>
<head>
    <meta http-equiv=Content-Type content=text/html; charset=UTF-8>
    <link rel="stylesheet" href="/default.css">
    <title>HeatingController32 Debug</title>
</head>
<body>
    <script src="/jquery-3.6.1.min.js"></script>
    <script>
        var ws;
        var reconnectInterval;
        var reconnectAttempts = 0;
        var maxReconnectAttempts = 5;
        var reconnectDelay = 2000; // Start with 2 seconds
        var autoScroll = true;
        
        function updateConnectionStatus(status, color) {
            var statusEl = $('#connectionStatus');
            statusEl.text(status);
            statusEl.css('background-color', color);
        }
        
        function connectWebSocket() {
            // Prevent multiple simultaneous connection attempts
            if (ws && ws.readyState === WebSocket.CONNECTING) {
                console.log('WebSocket connection already in progress, skipping...');
                return;
            }
            
            // Clean up existing connection
            if (ws) {
                ws.onopen = null;
                ws.onclose = null;
                ws.onerror = null;
                ws.onmessage = null;
            }
            
            updateConnectionStatus('Connecting...', '#ff9800');
            ws = new WebSocket('ws://' + window.location.host + '/ws/debug');
            
            ws.onopen = function() {
                console.log('WebSocket connected successfully');
                updateConnectionStatus('Connected', '#4CAF50');
                clearInterval(reconnectInterval);
                clearTimeout(reconnectInterval);
                reconnectAttempts = 0; // Reset on successful connection
                reconnectDelay = 2000; // Reset delay
            };
            
            ws.onmessage = function(event) {
                // Handle two types of messages:
                // 1. JSON with watermarks: {"taskSystemStack":..., "taskMainStack":...}
                // 2. Plain text debug output
                try {
                    var data = JSON.parse(event.data);
                    if (data.taskSystemStack !== undefined) {
                        updateWatermarks(data);
                    }
                } catch(e) {
                    // Plain text debug message
                    appendDebugOutput(event.data);
                }
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateConnectionStatus('Error', '#f44336');
            };
            
            ws.onclose = function(event) {
                console.log('WebSocket closed, code:', event.code, 'reason:', event.reason);
                clearInterval(reconnectInterval);
                clearTimeout(reconnectInterval);
                
                // Only reconnect if we haven't exceeded max attempts and it's not a normal closure
                if (reconnectAttempts < maxReconnectAttempts && event.code !== 1000) {
                    reconnectAttempts++;
                    var statusText = 'Reconnecting in ' + (reconnectDelay/1000) + 's... (attempt ' + reconnectAttempts + '/' + maxReconnectAttempts + ')';
                    updateConnectionStatus(statusText, '#ff9800');
                    console.log('Reconnecting in', reconnectDelay/1000, 'seconds... (attempt', reconnectAttempts, '/', maxReconnectAttempts, ')');
                    reconnectInterval = setTimeout(connectWebSocket, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 1.5, 30000); // Exponential backoff, max 30s
                } else if (reconnectAttempts >= maxReconnectAttempts) {
                    updateConnectionStatus('Max attempts reached', '#f44336');
                    console.log('Max reconnection attempts reached. Please refresh the page to try again.');
                    appendDebugOutput('\n[WebSocket] Max reconnection attempts reached. Please refresh the page.\n');
                } else {
                    updateConnectionStatus('Disconnected', '#666');
                    console.log('WebSocket closed normally, not reconnecting');
                }
            };
        }
        
        function appendDebugOutput(text) {
            var output = $('#debugOutput');
            output.append(text);
            if (autoScroll) {
                output.scrollTop(output[0].scrollHeight);
            }
        }
        
        function updateWatermarks(data) {
            $('#taskSystemStack').text(data.taskSystemStack);
            $('#taskMainStack').text(data.taskMainStack);
            $('#taskMqttStack').text(data.taskMqttStack);
            
            // Update reboot information if provided
            if (data.totalReboots !== undefined) {
                $('#totalReboots').text(data.totalReboots);
            }
            if (data.lastRebootTime !== undefined) {
                $('#lastRebootTime').text(data.lastRebootTime);
            }
            if (data.lastRebootReason !== undefined) {
                $('#lastRebootReason').text(data.lastRebootReason);
            }
            
            // Color coding for taskSystem
            if (data.taskSystemStack < 512) {
                $('#taskSystemStack').removeClass('warning').addClass('critical');
            } else if (data.taskSystemStack < 1024) {
                $('#taskSystemStack').removeClass('critical').addClass('warning');
            } else {
                $('#taskSystemStack').removeClass('warning critical');
            }
            
            // Color coding for taskMain
            if (data.taskMainStack < 512) {
                $('#taskMainStack').removeClass('warning').addClass('critical');
            } else if (data.taskMainStack < 1024) {
                $('#taskMainStack').removeClass('critical').addClass('warning');
            } else {
                $('#taskMainStack').removeClass('warning critical');
            }
            
            // Color coding for taskMqtt
            if (data.taskMqttStack < 512) {
                $('#taskMqttStack').removeClass('warning').addClass('critical');
            } else if (data.taskMqttStack < 1024) {
                $('#taskMqttStack').removeClass('critical').addClass('warning');
            } else {
                $('#taskMqttStack').removeClass('warning critical');
            }
            
            // Update available power if provided
            if (data.availablePower !== undefined) {
                for (var i = 0; i < 3; i++) {
                    var phaseId = '#phase' + (i + 1) + 'Power';
                    $(phaseId).text(data.availablePower[i]);
                    
                    // Color code based on measurement source
                    if (data.usingMeasured[i]) {
                        $(phaseId).css('color', '#4CAF50');  // Green for measured
                    } else {
                        $(phaseId).css('color', '#888');     // Gray for estimated
                    }
                }
            }
        }
        
        $(document).ready(function() {
            connectWebSocket();
            
            $('#clearBtn').click(function() {
                $('#debugOutput').text('');
            });
            
            $('#autoScrollBtn').click(function() {
                autoScroll = !autoScroll;
                if (autoScroll) {
                    $(this).text('Auto-scroll: ON');
                    $(this).css('background-color', '#4CAF50');
                } else {
                    $(this).text('Auto-scroll: OFF');
                    $(this).css('background-color', '#666');
                }
            });
            
            $('#reconnectBtn').click(function() {
                console.log('Manual reconnect requested');
                // Reset reconnection state
                reconnectAttempts = 0;
                reconnectDelay = 2000;
                clearInterval(reconnectInterval);
                clearTimeout(reconnectInterval);
                
                // Close existing connection if any
                if (ws) {
                    ws.close();
                }
                
                // Start new connection
                connectWebSocket();
            });
        });
    </script>
    <div class="content">
        <div style="color:#eaeaea;">
            <h3>Debug Information</h3>
        </div>
        
        <div style="color:#eaeaea;">
            <div class="debug-field">
                <label>Total Reboots:</label>
                <span id="totalReboots">%TOTAL_REBOOTS%</span>
            </div>
            
            <div class="debug-field">
                <label>Last Reboot Time:</label>
                <span id="lastRebootTime">%LAST_REBOOT_TIME%</span>
            </div>
            
            <div class="debug-field">
                <label>Last Reboot Reason:</label>
                <span id="lastRebootReason">%LAST_REBOOT_REASON%</span>
            </div>
            
            <div class="debug-field">
                <label>taskSystem Stack Free:</label>
                <span id="taskSystemStack">-</span> bytes
            </div>
            
            <div class="debug-field">
                <label>taskMain Stack Free:</label>
                <span id="taskMainStack">-</span> bytes
            </div>
            
            <div class="debug-field">
                <label>taskMqtt Stack Free:</label>
                <span id="taskMqttStack">-</span> bytes
            </div>
            
            <div class="debug-field">
                <label>Available Power:</label>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <span class="power-label">Phase 1: <span id="phase1Power" class="power-value">-</span> W</span>
                    <span class="power-label">Phase 2: <span id="phase2Power" class="power-value">-</span> W</span>
                    <span class="power-label">Phase 3: <span id="phase3Power" class="power-value">-</span> W</span>
                </div>
            </div>
            
            <div style="margin: 20px 0;">
                <label style="font-weight: bold;">Debug Output:</label>
                <div id="debugOutput"></div>
            </div>

            <div style="margin: 20px 0; display: flex; gap: 10px; justify-content: center;">
                <button id="autoScrollBtn" class="bgrn" style="flex: 1; max-width: 200px;">Auto-scroll: ON</button>
                <button id="clearBtn" class="bgrn" style="flex: 1; max-width: 200px;">Clear Display</button>
                <button id="reconnectBtn" class="bgrn" style="flex: 1; max-width: 200px;">Reconnect WebSocket</button>
            </div>
            
            <div style="margin: 10px 0; text-align: center;">
                <span id="connectionStatus" style="padding: 5px 10px; border-radius: 3px; background-color: #666; color: white;">Connecting...</span>
            </div>
        </div>
        
        <div class="spacer"></div>
        <p class="item-main"><a href="/">Main</a></p>
    </div>
    <p class="build-no">Build: %BUILD_NO%</p>
</body>
</html>
